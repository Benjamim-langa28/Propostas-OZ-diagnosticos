[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oz-proposals-api"
version = "0.1.0"
description = "API FastAPI para pedidos, análise e propostas OZ"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "python-dotenv>=1.0",
  "httpx>=0.27,<1.0",
  "python-multipart>=0.0.9",
  "PyMuPDF>=1.24",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "reportlab>=4.2,<5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
include = ["app*"]
