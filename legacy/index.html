:root{--bg:#e9ece8;--card:#f7f8f5;--ink:#1c2a31;--mute:#5d6b70;--line:#c9d0cb;--acc:#25585a;--warn:#b7791f;--bad:#a63d2f;--ok:#3b7a4b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#161d20;--card:#1f292d;--ink:#e6ebe8;--mute:#93a3a6;--line:#33434a;--acc:#6fb3b0;--warn:#e0a94a;--bad:#e27a6a;--ok:#7fc08f}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'IBM Plex Sans',system-ui,sans-serif}
header{display:flex;gap:16px;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:2px solid var(--ink);flex-wrap:wrap}
header b{font-size:17px;letter-spacing:.2px}header span{color:var(--mute);font-size:13px}
main{max-width:980px;margin:0 auto;padding:20px}
h2{font:600 22px 'Source Serif 4',serif;margin:0 0 12px}h3{font-size:15px;margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:16px;margin-bottom:14px}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--acc);color:#fff;border:0;padding:8px 14px;border-radius:3px;cursor:pointer;font-weight:500}
button.g{background:transparent;color:var(--ink);border:1px solid var(--line)}button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--warn);outline-offset:2px}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:6px 8px;width:100%}
textarea{min-height:190px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.grow{flex:1;min-width:150px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stats div{border-left:4px solid var(--acc);padding:4px 12px}.stats b{font-size:28px;display:block}
.tag{font-size:11px;padding:1px 6px;border-radius:2px;border:1px solid currentColor;white-space:nowrap}
.UNKNOWN,.REQUIRES_REVIEW{color:var(--bad)}.INFERRED,.SUGGESTED{color:var(--warn)}.EXTRACTED,.VALIDATED{color:var(--ok)}
table{width:100%;border-collapse:collapse}td,th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}th{font-size:12px;color:var(--mute);font-weight:500}
td.n,th.n{text-align:right;white-space:nowrap}td input[type=number]{width:74px;text-align:right}
.li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.alert{border-left:4px solid var(--bad);padding:6px 12px;background:var(--card);margin-bottom:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:700px){.two{grid-template-columns:1fr}}
.paper{background:#fff;color:#1a1a1a;font:15px/1.6 'Source Serif 4',Georgia,serif;padding:44px 48px;border:1px solid var(--line);max-width:800px;margin:0 auto}
.paper h4{font:600 15px 'Source Serif 4',serif;margin:20px 0 4px}.paper table td,.paper table th{border-color:#ccc}
.paper [contenteditable]{outline:1px dashed #b7791f55;min-height:1.4em}.foot{margin-top:30px;border-top:1px solid #999;padding-top:8px;font-size:12px;color:#555}
@media print{header,.noprint{display:none!important}body{background:#fff}.paper{border:0;padding:0}}
.chip{font-size:12px;color:var(--acc);text-decoration:none;border-bottom:1px dotted var(--acc);white-space:nowrap}td .chip{margin-right:2px;display:inline-block}

const fname=(p,x)=>`OZ_Proposta_${p.doc.no.replace('/','-')}.${x}`;
function dlPdf(){const p=cur();html2pdf().set({margin:12,filename:fname(p,'pdf'),html2canvas:{scale:2},jsPDF:{unit:'mm',format:'a4'}}).from(document.querySelector('.paper')).save()}
function dlDoc(){const p=cur();dl(fname(p,'doc'),new Blob(['<html xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><style>body{font-family:Georgia,serif}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #ccc;padding:4px}</style></head><body>'+document.querySelector('.paper').innerHTML+'</body></html>'],{type:'application/msword'}))}
function dlMqt(){const p=cur(),m=p.mqt,wb=XLSX.read(m.b64,{type:'base64'}),ws=wb.Sheets[wb.SheetNames[0]];
 if(m.hd>=0)XLSX.utils.sheet_add_aoa(ws,[['Preço unitário (OZ)','Total (OZ)','Observações']],{origin:{r:m.hd,c:m.pc}});
 p.items.filter(i=>i.row!=null).forEach(i=>XLSX.utils.sheet_add_aoa(ws,[[i.price||'',i.price?i.price*i.qty:'',i.o==='REQUIRES_REVIEW'&&!i.price?'A rever pelo engenheiro':'']],{origin:{r:i.row,c:m.pc}}));
 dl(`MQT_preenchido_${p.doc.no.replace('/','-')}.xlsx`,new Blob([XLSX.write(wb,{type:'array',bookType:'xlsx'})],{type:'application/octet-stream'}))}
function setSt(s){const p=cur();p.status=s;lg(p,'Estado: '+s);save();render()}
function openMail(to,subject,body){const url='mailto:'+encodeURIComponent(to||'')+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body);location.href=url}
function mail(){const p=cur(),d=p.doc,b=`Exmos. Senhores,\n\nEm resposta ao vosso pedido, junto se envia a Proposta Nº. ${d.no} (${p.a.project.v}).\n\nCom os melhores cumprimentos,\nOZ`;openMail(p.a.email.v,`Proposta Nº. ${d.no} — ${p.a.project.v}`,b)}
function doc(){
 const p=cur(),a=p.a,d=p.doc;d.s=d.s||{};const md=p.mode||'full';
 const on=p.items.filter(i=>i.on),base=on.filter(i=>!i.opt),opt=on.filter(i=>i.opt),TBD='<span style="color:#b7791f">[A definir pelo engenheiro]</span>';
 const cl=(a.client.v||'').toLowerCase(),pq=S.list.find(q=>q!==p&&q.doc&&q.doc.s&&q.doc.s.pag&&(q.a.client.v||'').toLowerCase()===cl&&cl);
 const cleanHtml=(v)=>window.DOMPurify?DOMPurify.sanitize(v,{ALLOWED_TAGS:['p','br','ul','ol','li','b','strong','i','em'] ,ALLOWED_ATTR:[]}):esc(v).replace(/\n/g,'<br>');
 const ed=(k,def)=>`<div contenteditable="true" oninput="cur().doc.s['${k}']=this.innerHTML;save()">${cleanHtml(d.s[k]!=null?d.s[k]:def)}</div>`;
 const row=i=>`<tr><td>${esc(i.name)}</td><td style="text-align:right">${i.qty} ${esc(i.unit)} × ${i.price?eur(i.price):'—'}</td><td style="text-align:right">${i.price?eur(i.qty*i.price):TBD}</td></tr>`;
 const st=p.status;
 return`<div class="card noprint"><div class="row"><select style="width:auto" onchange="cur().mode=this.value;save();render()"><option value="full" ${md==='full'?'selected':''}>Proposta completa</option><option value="tec" ${md==='tec'?'selected':''}>Proposta técnica (sem preços)</option><option value="com" ${md==='com'?'selected':''}>Proposta comercial (sem condições técnicas)</option></select>
 <button onclick="dlPdf()">Descarregar PDF</button><button class="g" onclick="dlDoc()">Descarregar Word</button>${p.mqt?'<button class="g" onclick="dlMqt()">Descarregar MQT preenchido (.xlsx)</button>':''}<button class="g" onclick="print()">Imprimir</button></div>
 <div class="row" style="margin-top:10px"><span class="tag ${st==='SENT'||st==='ACCEPTED'?'VALIDATED':'SUGGESTED'}">${st}</span><button class="g" onclick="mail()">Abrir rascunho de email</button><button class="g" onclick="setSt('SENT')">Marcar como enviada</button><button class="g" onclick="setSt('ACCEPTED')">Aceite</button><button class="g" onclick="setSt('REJECTED')">Rejeitada</button><button class="g" onclick="go('rev')">Voltar ao âmbito</button></div>
 <p style="margin:8px 0 0;color:var(--mute)">As secções a tracejado são editáveis e ficam guardadas. O email abre sem anexo: junte o ficheiro descarregado.</p></div>
 <div class="paper"><div style="display:flex;justify-content:space-between;gap:12px"><b>OZ — Diagnóstico, Levantamento e Controlo de Qualidade em Estruturas e Fundações, Lda.</b><span style="text-align:right;white-space:nowrap">N. ref. ${d.ref}<br>Consulta ${d.cons}</span></div>
 <p style="margin-top:22px">Lisboa, ${d.date}<br><b>${esc(a.client.v)||TBD}</b></p><p><b>Proposta Nº. ${d.no}</b><br>Assunto: ${esc(a.project.v)}${a.loc.v?' — '+esc(a.loc.v):''}</p>
 <h4>1. Objeto</h4>${ed('obj','Em resposta ao pedido recebido, apresenta-se proposta técnica e comercial para: '+(esc(a.obj.v)||TBD))}
 <h4>2. Considerações prévias</h4>${ed('cons',((p.pats||[]).filter(x=>x.on).length?'Patologias a investigar: '+(p.pats||[]).filter(x=>x.on).map(x=>esc(KD[x.c].replace(/ \+$/,''))).join('; ')+'. ':'')+(a.year.v?`Edifício de ${esc(a.year.v)}. `:'')+(a.cx.length?'Condicionantes: '+a.cx.join('; ').toLowerCase()+'. ':'')+(p.assum&&a.miss.length?'Proposta elaborada com pressupostos, a confirmar com a informação em falta ('+a.miss.join('; ')+'). ':''))}
 ${md!=='com'?`<h4>3. Condições técnicas</h4>${ed('tec','<ul>'+on.map(i=>`<li><b>${esc(i.name)}</b>${i.basis?' — '+esc(i.basis):''}${i.opt?' (opcional)':''}</li>`).join('')+'</ul>')}`:''}
 ${md!=='tec'?`<h4>4. Preços</h4><table>${base.length?'<tr><th colspan=3 style="text-align:left">Base</th></tr>'+base.map(row).join(''):''}${opt.length?'<tr><th colspan=3 style="text-align:left">Opcional</th></tr>'+opt.map(row).join(''):''}
 <tr><td colspan=2 style="text-align:right">Subtotal</td><td style="text-align:right">${eur(tot(p))}</td></tr><tr><td colspan=2 style="text-align:right">IVA (${p.vat}%)</td><td style="text-align:right">${eur(tot(p)*p.vat/100)}</td></tr><tr><td colspan=2 style="text-align:right"><b>Total</b></td><td style="text-align:right"><b>${eur(tot(p)*(1+p.vat/100))}</b></td></tr></table>
 <h4>5. Condições de pagamento</h4>${ed('pag',pq?pq.doc.s.pag:TBD)}`:''}
 <h4>6. Prazos</h4>${ed('praz',TBD)}<h4>7. Exclusões</h4>${ed('excl',TBD)}
 <div class="foot">ISO 9001 · Marca de Qualidade LNEC · membro GECoRPA<br>O Gerente, ____________________</div></div>`;
}
boot();
</script></body></html>
